name: Build and release

on:
  workflow_dispatch:
    inputs:
      nightly:
        type: boolean
        default: true
        description: "Build a nightly version"
      zju_connect_nightly:
        type: boolean
        default: false
        description: "Use nightly zju-connect"
      version:
        type: string
        default: ""
        description: "Release version when nightly is disabled (e.g. v0.0.0)"
      publish_release:
        type: boolean
        default: false
        description: "Upload to the existing release for version (requires nightly disabled)"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  QT_VERSION: "6.10.3"
  TARGET_NAME: "SHOUConnect"
  DISPLAY_NAME: "SHOUConnect"
  NIGHTLY_BUILD: ${{ inputs.nightly }}
  RELEASE_VERSION: ${{ inputs.version }}
  CORE_NIGHTLY: ${{ inputs.zju_connect_nightly }}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
            qt-host: windows
            qt-arch: win64_msvc2022_64
            architecture: amd64
            cmake-architecture: x64
            package-dir: SHOUConnect
            extension: zip
          - platform: windows-arm64
            runner: windows-11-arm
            qt-host: windows_arm64
            qt-arch: win64_msvc2022_arm64
            architecture: arm64
            cmake-architecture: ARM64
            package-dir: SHOUConnect
            extension: zip
          - platform: macos-arm64
            runner: macos-26
            qt-host: mac
            qt-arch: clang_64
            architecture: arm64
            package-dir: SHOUConnect.app
            extension: zip
          - platform: linux-x64
            runner: ubuntu-24.04
            qt-host: linux
            qt-arch: linux_gcc_64
            architecture: x86_64
            package-dir: AppDir
            extension: AppImage
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            qt-host: linux_arm64
            qt-arch: linux_gcc_arm64
            architecture: arm64
            package-dir: AppDir
            extension: AppImage
    env:
      PLATFORM: ${{ matrix.platform }}
      ARCHITECTURE: ${{ matrix.architecture }}
      CMAKE_ARCHITECTURE: ${{ matrix.cmake-architecture }}
      PACKAGE_DIR: ${{ matrix.package-dir }}
      ARCHIVE_EXTENSION: ${{ matrix.extension }}
      REPOSITORY_NAME: ${{ github.event.repository.name }}
    steps:
      - name: Validate release options
        if: inputs.publish_release && inputs.nightly
        run: |
          echo '::error::Disable nightly and provide a version to publish release assets.'
          exit 1

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Refresh Linux package index
        if: runner.os == 'Linux'
        run: sudo apt-get update

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libevent-2.1-7t64 libminizip1t64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt-host }}
          target: desktop
          arch: ${{ matrix.qt-arch }}
          modules: >-
            qt5compat qtpositioning qtwebchannel qtwebengine
            ${{ runner.os == 'Linux' && 'qtserialport' || '' }}
          cache: true
          cache-key-prefix: qt-${{ matrix.runner }}-${{ matrix.platform }}
          # aqt 3.3.0 predates native Windows ARM64 WebEngine support (aqtinstall#941).
          aqtsource: >-
            ${{ matrix.platform == 'windows-arm64'
                && 'git+https://github.com/miurahr/aqtinstall.git@06bcc88d55d512e6db6756a587a9363d3f7c84e7'
                || '' }}

      - name: Configure
        run: |
          args=(-S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF)
          archive_version=nightly
          if [[ "$NIGHTLY_BUILD" == true ]]; then
            args+=(-DNIGHTLY_BUILD=ON "-DGIT_HASH=$(git rev-parse --short=7 HEAD)")
          else
            version="${RELEASE_VERSION#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo '::error::A release build requires a version such as v1.2.3 or v1.2.3-rc.1.'
              exit 1
            fi
            args+=(-DNIGHTLY_BUILD=OFF "-DREL_VER=$version")
            archive_version="$RELEASE_VERSION"
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            args+=(-A "$CMAKE_ARCHITECTURE")
          elif [[ "$RUNNER_OS" == macOS ]]; then
            args+=("-DCMAKE_OSX_ARCHITECTURES=$ARCHITECTURE")
          fi
          cmake "${args[@]}"
          archive_name="$REPOSITORY_NAME-$archive_version-$PLATFORM"
          {
            echo "ARCHIVE_NAME=$archive_name"
            echo "ARCHIVE_PATH=$archive_name.$ARCHIVE_EXTENSION"
            echo "CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 2)')"
          } >> "$GITHUB_ENV"

      - name: Build
        run: cmake --build build --target "$TARGET_NAME" --config Release

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/deploy-windows.ps1 -TargetName $env:TARGET_NAME -DisplayName $env:DISPLAY_NAME `
            -BuildDir build -Architecture $env:ARCHITECTURE -Nightly $env:CORE_NIGHTLY
          Compress-Archive -LiteralPath $env:DISPLAY_NAME -DestinationPath $env:ARCHIVE_PATH -CompressionLevel Optimal

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          ./scripts/deploy-macos.sh "$TARGET_NAME" build "$ARCHITECTURE" "$CORE_NIGHTLY"
          ditto -c -k --sequesterRsrc --keepParent "$TARGET_NAME.app" "$ARCHIVE_PATH"

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          ./scripts/deploy-linux.sh "$TARGET_NAME" "$DISPLAY_NAME" build "$ARCHITECTURE" "$CORE_NIGHTLY"
          appimages=(./*.AppImage)
          if [[ ${#appimages[@]} -ne 1 || ! -f "${appimages[0]}" ]]; then
            echo '::error::Expected exactly one AppImage.'
            exit 1
          fi
          mv -- "${appimages[0]}" "$ARCHIVE_PATH"

      - name: Report package size
        run: python scripts/package_tools.py report "$PACKAGE_DIR" --archive "$ARCHIVE_PATH" --output package-size.json

      - name: Upload package
        uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ env.ARCHIVE_PATH }}
          if-no-files-found: error
          archive: false

      - name: Upload size reports
        uses: actions/upload-artifact@v7.0.2
        with:
          name: size-${{ env.ARCHIVE_NAME }}
          path: |
            package-size.json
            package-pruning.json
          if-no-files-found: error

  release:
    if: inputs.publish_release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      ARCHIVE_PREFIX: ${{ github.event.repository.name }}-${{ inputs.version }}
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: ${{ env.ARCHIVE_PREFIX }}-*
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.version }}
        run: gh release upload "$RELEASE_TAG" dist/"$ARCHIVE_PREFIX"-* --repo "$GH_REPO" --clobber
